name: Run tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: ${{ matrix.name}}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: 3.12
            name: Python 3.12 with minimal dependencies
            toxenv: py312-test

          - os: ubuntu-latest
            python-version: '3.11'
            name: Python 3.11 with minimal dependencies
            toxenv: py311-test

          - os: ubuntu-latest
            python-version: '3.10'
            name: Python 3.10 with minimal dependencies
            toxenv: py310-test

          - os: ubuntu-latest
            python-version: 3.13
            name: Python 3.13 with minimal dependencies
            toxenv: py313-test

          - os: ubuntu-latest
            python-version: 3.14
            name: Python 3.14 with minimal dependencies
            toxenv: py314-test

          - os: ubuntu-latest
            python-version: 3.12
            name: Python 3.12, all dependencies, and dev versions of key dependencies
            toxenv: py312-test-dev

          - os: ubuntu-latest
            python-version: 3.12
            name: Python 3.12, all dependencies, and coverage
            toxenv: py312-test-all-cov

          - os: macos-latest
            python-version: 3.12
            name: Python 3.12 with all dependencies on MacOS X
            toxenv: py312-test-all-dev

          - os: ubuntu-latest
            python-version: 3.12
            name: Documentation
            toxenv: build_docs

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install testing dependencies
      run: python -m pip install tox codecov
    - name: Run tests with ${{ matrix.name }}
      run: tox -v -e ${{ matrix.toxenv }}
    - name: Upload coverage to codecov
      if: ${{ contains(matrix.toxenv,'-cov') }}
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml